  /actions:
    post:
      summary: Register action
      description: >
        Register an action (async agent-to-agent RPC). Invocations are delivered to the
        handler's node as `action.invoke` frames; agent SDKs surface them as
        `action.invoked` callbacks. Replaces the legacy `/commands` API. When called
        with an agent token, `handler_agent` must be the calling agent.
        Registration is an idempotent assertion: re-registering an existing name
        refreshes its description, handler, schemas, `available_to`, and
        `is_active` in place (200) instead of conflicting. When the refresh moves
        the handler to a different agent, invocations still in flight toward the
        previous handler are failed (`handler_unavailable`) and their callers
        receive `action.failed`. Exactly one of `handler_agent` or
        `handler_node` is required.
      tags:
        - Actions
      security:
        - workspaceKey: []
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
              # Exactly one handler: a request with both or neither fails oneOf.
              oneOf:
                - required: [handler_agent]
                - required: [handler_node]
              properties:
                name:
                  type: string
                description:
                  type: string
                handler_agent:
                  type: string
                  description: Handler agent name. Exactly one of `handler_agent` or `handler_node`.
                handler_node:
                  type: string
                  description: Handler node name; the node must provide the capability. Exactly one of `handler_agent` or `handler_node`.
                input_schema:
                  type: object
                output_schema:
                  type: object
                available_to:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Action registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '200':
          description: Existing action refreshed (idempotent re-register)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
      summary: List actions
      description: List registered actions. Restricted actions are visible only when the caller is an agent allowed by `available_to`; actions with no `available_to` restriction are visible to any authenticated caller.
      tags:
        - Actions
      security:
        - workspaceKey: []
        - agentToken: []
      responses:
        '200':
          description: Action list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /actions/{name}:
    get:
      summary: Get action
      description: Get a single registered action by name. Returns not found when the action is restricted by `available_to` and the caller is not an allowed agent.
      tags:
        - Actions
      security:
        - workspaceKey: []
        - agentToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    delete:
      summary: Delete action
      description: Delete a registered action. Open invocations of the action are failed (`action_deleted`) and their callers receive `action.failed`.
      tags:
        - Actions
      security:
        - workspaceKey: []
        - agentToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Action deleted

  /actions/{name}/invoke:
    post:
      summary: Invoke action
      description: Invoke a registered action. The caller must be an agent allowed by `available_to`; the request returns an async ack containing `invocation_id`, dispatches an `action.invoke` frame to the handler's node, and delivers `action.denied` to the caller's node on denied calls.
      tags:
        - Actions
      security:
        - agentToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Reuse the same key to retry one logical invocation; a replay returns
            the original invocation. The server trims leading and trailing
            whitespace, then requires the normalized key to contain 1-255 visible
            ASCII characters.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
      responses:
        '201':
          description: Action invocation created; response `data` includes `invocation_id`
          headers:
            Idempotency-Replayed:
              description: Set to `true` when the original invocation is replayed.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid `Idempotency-Key` header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The idempotency key was reused with different input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Agent token required, or caller is not allowed to invoke this action. Denied agent callers receive an `action.denied` event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >
            `handler_unavailable` — the action's handler agent has no live
            connection, so the invocation fails fast instead of queueing toward
            a handler that cannot answer; or `idempotency_unavailable` — the
            durable idempotency claim cannot be read, or a keyed invocation
            replay cannot yet observe its durable placement/dispatch outcome.
            Retry
            the same logical request with the same key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

