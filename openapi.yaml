      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  nullable: true
                pattern:
                  type: string
                  nullable: true
                mention:
                  type: boolean
                  nullable: true
                action_name:
                  type: string
                  description: >-
                    Name of the action invoked on a match. Resolution prefers agent-hosted
                    actions, then node actions with workspace-global aliases, then plain
                    node-scoped actions. A node-scoped match dispatches to its owning node.
                    Ties select one action deterministically by action ID; triggers do not
                    fan out.
                enabled:
                  type: boolean
      responses:
        '200':
          description: Trigger updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
