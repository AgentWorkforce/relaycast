            enum: [queued, delivered, acked, failed, dead_lettered]
        - name: limit
          in: query
          required: false
          description: Maximum number of items to return (1-200, default 100).
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Queued delivery items
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeliveryItem'

  /deliveries/{id}/ack:
    post:
      summary: Acknowledge a delivery
      description: Idempotently transition a delivery to `acked`.
      tags:
        - Deliveries
      security:
        - agentToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Delivery'
        '404':
          description: Delivery not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /deliveries/{id}/fail:
    post:
      summary: Fail a delivery
      description: >
        Idempotently record a delivery as `failed`, capturing error text and
        whether a retry is sane.
      tags:
        - Deliveries
      security:
        - agentToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                retryable:
                  type: boolean
      responses:
        '200':
          description: Updated delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Delivery'
        '404':
          description: Delivery not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /deliveries/{id}/defer:
    post:
      summary: Defer a delivery
      description: >
        Compatibility endpoint that keeps the delivery `queued` while recording
        the time it next becomes available for retry.
      tags:
        - Deliveries
      security:
        - agentToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - available_at
              properties:
                available_at:
                  type: string
                  format: date-time
                reason:
                  type: string
      responses:
        '200':
          description: Updated delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Delivery'
        '400':
          description: Invalid available_at
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Delivery not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

