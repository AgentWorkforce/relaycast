      description: List declarative message triggers for the workspace.
      tags:
        - Triggers
      security:
        - workspaceKey: []
        - agentToken: []
      responses:
        '200':
          description: Trigger list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /triggers/{id}:
