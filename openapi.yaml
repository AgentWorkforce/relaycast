          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Bind agent to node
      description: >
        Bind an agent to a delivery node. The node's adapter controls how future deliveries
        to that agent are sent. HTTP push nodes default to `max_agents: 1`.
      tags:
        - Nodes
      security:
        - workspaceKey: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
