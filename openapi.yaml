        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Subscription deleted

  /webhooks:
    post:
      summary: Create inbound webhook
      description: Create inbound webhook that posts to a channel
      tags:
        - Webhooks
      security:
        - workspaceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - channel
              properties:
                name:
                  type: string
                channel:
                  type: string
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
      summary: List inbound webhooks
      description: List inbound webhooks for workspace
      tags:
        - Webhooks
      security:
        - workspaceKey: []
      responses:
        '200':
          description: Webhook list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /webhooks/{id}:
    delete:
      summary: Delete inbound webhook
      description: Delete inbound webhook by ID
      tags:
        - Webhooks
      security:
        - workspaceKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Webhook deleted

  /hooks/{webhookId}:
    post:
      summary: Trigger inbound webhook
      description: Public endpoint to post through a configured inbound webhook
      tags:
        - Webhooks
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                source:
                  type: string
                payload:
                  type: object
      responses:
        '201':
          description: Webhook delivered as message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /ws:
    get:
      summary: WebSocket stream
      description: Upgrade to workspace or agent realtime stream via token query parameter
      tags:
        - System
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Agent token (`at_live_*`) or workspace key (`rk_live_*`)
      responses:
        '101':
          description: Switching Protocols (WebSocket)
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

