                  data:
                    type: object

  /channels/{name}/messages:
    post:
      summary: Post message
      description: Post a message to a channel
      tags:
        - Messages
      security:
        - agentToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          schema:
            type: string
          description: Idempotency key for duplicate prevention
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                blocks:
                  type: array
                  items:
                    type: object
                attachments:
                  type: array
                  items:
                    type: string
                data:
                  type: object
                  description: User metadata stored with the message. Internal `__relaycast_*` keys are stripped and cannot override sender identity.
                content_type:
                  type: string
                mode:
                  type: string
                  enum: [wait, steer]
                  default: wait
                  description: Injection mode for relay delivery
      responses:
        '201':
          description: Message posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Message'

    get:
      summary: List messages
      description: >-
        Get messages from a channel. Observer tokens require `messages:read`.
        Messages are retained indefinitely by default; if the workspace's
        `retention.message_ttl_days` (or a deployment default — the hosted
        service uses 30 days) enables pruning, older messages are not returned.
      tags:
        - Messages
      security:
        - workspaceKey: []
        - agentToken: []
        - observerToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: before
          in: query
          schema:
            type: string
          description: Message ID to fetch messages before
        - name: after
          in: query
          schema:
            type: string
          description: Message ID to fetch messages after
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'

  /sessions/{session_ref}/messages:
    get:
      operationId: getSessionMessages
      summary: Resolve messages by session reference
      description: >-
        Returns a bounded, index-backed slice of messages stamped with the
        opaque `session_ref`, together with the workspace's live effective
        retention boundary. A payload-free ledger distinguishes a known
        aged-out session from an unknown or never-observed reference. Results
        with `availability: unknown` must never be presented as replayable.
        `partial` means the session began before the current boundary and only
        its retained tail is returned, or that pre-migration provenance cannot
        prove the true start. A workspace key is required because a session may
        span channels and direct-message conversations.
      tags:
        - Messages
      security:
        - workspaceKey: []
      parameters:
        - name: session_ref
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: Opaque session reference stored in message metadata.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: after
          in: query
          schema:
            type: string
            pattern: '^(0|[1-9][0-9]*)$'
          description: Message ID cursor from `page.next_cursor`.
      responses:
        '200':
          description: Session availability, retention boundary, and retained messages.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/SessionMessagesResult'
        '400':
          description: Invalid session reference or pagination query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /messages/{id}:
    get:
      summary: Get message
      description: Get a single message by ID. Observer tokens require `messages:read` for channel messages or `dms:read` for DM-backed messages, subject to filters.
      tags:
