                agent_name:
                  type: string
                session_ref:
                  type: string
                  nullable: true
                priority:
                  type: integer
      responses:
        '201':
          description: Agent bound to node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Node or agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Node capacity exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /nodes/{name}/agents/{agent_name}:
    delete:
      summary: Unbind agent from node
      description: Remove an active binding between an agent and a node.
      tags:
        - Nodes
      security:
        - workspaceKey: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: agent_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Agent unbound from node
        '404':
          description: Binding not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /nodes/{node}/actions/{name}/invoke:
    post:
      summary: Invoke a node-addressed action
      description: >
        Invoke an action on a specific node. The engine resolves the action to
        the provider that registered it and dispatches over that provider's
        socket. A `spawn:<harness>` name with no shadow action falls through to
        the node's native capacity. Fails fast with `handler_unavailable` when
        the owning provider is offline unless the capability opted into queueing.
      tags:
        - Nodes
      security:
        - agentToken: []
      parameters:
        - name: node
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
      responses:
        '201':
          description: Invocation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: Agent token required or caller not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Node or action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Owning provider offline (fail fast)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /nodes/{node}/providers/{name}:
    delete:
      summary: Remove a node provider
      description: >
        Remove a provider's attachment, its persisted capability set, and the
        actions it materialized on the node. When it was the node's last provider
        the node goes offline.
      tags:
        - Nodes
      security:
        - workspaceKey: []
      parameters:
        - name: node
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Provider removed
        '404':
          description: Node not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /node/ws:
    get:
      summary: Node control WebSocket
      description: >
        Upgrade to the node-control realtime stream. Direct nodes and broker
        nodes connect here with an `nt_live_*` node token to receive deliver
        frames, best-effort targeted context.update events, action placement,
        and scoped context, and to report status.
      tags:
        - Nodes
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Node token (`nt_live_*`)
      responses:
        '101':
          description: Switching Protocols (WebSocket)
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /triggers:
    post:
      summary: Create message trigger
      description: Create a declarative message trigger that invokes an action when matched.
      tags:
        - Triggers
      security:
        - workspaceKey: []
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action_name
              properties:
                channel:
                  type: string
                  nullable: true
                pattern:
                  type: string
                  nullable: true
                mention:
                  type: boolean
                  nullable: true
                action_name:
                  type: string
                  description: >-
                    Name of the action invoked on a match. Resolution prefers agent-hosted
                    actions, then node actions with workspace-global aliases, then plain
                    node-scoped actions. A node-scoped match dispatches to its owning node.
                    Ties select one action deterministically by action ID; triggers do not
                    fan out.
                enabled:
                  type: boolean
      responses:
        '201':
          description: Trigger created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
