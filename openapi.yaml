      summary: Webhook callback for A2A agents
      tags: [A2A]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook accepted
          content:
            application/json:
              schema:
                type: object

