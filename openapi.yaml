  /actions:
    post:
      summary: Register action
      description: >
        Register an action (async agent-to-agent RPC). The handler agent receives invocations and
        reports results. Replaces the legacy `/commands` API. When called with an agent token,
        `handler_agent` must be the calling agent.
      tags:
        - Actions
      security:
        - workspaceKey: []
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
                - handler_agent
              properties:
                name:
                  type: string
                description:
                  type: string
                handler_agent:
                  type: string
                input_schema:
                  type: object
                output_schema:
                  type: object
                available_to:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Action registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
      summary: List actions
      description: List registered actions. Restricted actions are visible only when the caller is an agent allowed by `available_to`; actions with no `available_to` restriction are visible to any authenticated caller.
      tags:
        - Actions
      security:
        - workspaceKey: []
        - agentToken: []
      responses:
        '200':
          description: Action list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /actions/{name}:
    get:
      summary: Get action
      description: Get a single registered action by name. Returns not found when the action is restricted by `available_to` and the caller is not an allowed agent.
      tags:
        - Actions
      security:
        - workspaceKey: []
        - agentToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    delete:
      summary: Delete action
      description: Delete a registered action
      tags:
        - Actions
      security:
        - workspaceKey: []
        - agentToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Action deleted

  /actions/{name}/invoke:
    post:
      summary: Invoke action
      description: Invoke a registered action. The caller must be an agent allowed by `available_to`; the request returns an async ack containing `invocation_id`, emits `action.invoked` to the handler agent, and emits `action.denied` to the calling agent on denied calls.
      tags:
        - Actions
      security:
        - agentToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
      responses:
        '201':
          description: Action invocation created; response `data` includes `invocation_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: Agent token required, or caller is not allowed to invoke this action. Denied agent callers receive an `action.denied` event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /actions/{name}/invocations/{id}/complete:
    post:
      summary: Complete action invocation
      description: Handler agent reports the result (or error) of an invocation.
      tags:
        - Actions
      security:
        - agentToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                output:
                  type: object
                error:
                  type: string
                duration_ms:
                  type: integer
      responses:
        '200':
          description: Invocation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /actions/{name}/invocations/{id}:
    get:
      summary: Get action invocation
      description: Get the status and result of an action invocation
      tags:
        - Actions
      security:
        - workspaceKey: []
        - agentToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /nodes:
