  /nodes:
    post:
      summary: Enroll or rotate a node token
      description: >
        Enroll a delivery node in the workspace or rotate the token for an existing node.
        When `node_id` is supplied, it is the enrollment key: a matching node is rotated
        in place (and renamed if `name` differs), a new `node_id` creates a new node, and
        a `name` already held by a different node is rejected with `node_name_conflict`
        (409). Without `node_id`, an existing node with the same `name` is rotated; failing
        that, a `machine_id` is matched against the machine's existing `broker` node, so a
        host that re-enrolls under a fresh name rotates that node instead of adding a roster
        entry. `direct` nodes are never matched by `machine_id` — one machine legitimately
        runs many of them. Reuse also requires the matched row to have heartbeated at least
        once and then gone stale: a row that never connected, one that is still live, and one
        whose heartbeat is in the future are all left alone, so a caller presenting such a
        `machine_id` receives its own node and the incumbent's id, name and token are
        unchanged. Two hosts cold-booting from one image therefore keep separate identities.
        Fleet WebSocket nodes use the returned token on `/node/ws`; HTTP push nodes store a
        delivery endpoint and can host one bound agent by default.
      tags:
        - Nodes
      security:
        - workspaceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                node_id:
                  type: string
                  description: Stable node identity. When supplied, enrollment keys on it — matching node rotated in place, new id creates a node — instead of resolving by name.
                name:
                  type: string
                machine_id:
                  type: string
                  description: Stable id of the host machine. Used as the enrollment key of last resort, after `node_id` and `name`, so a host that keeps no `node_id` and renames itself on each boot rotates its existing `broker` node instead of growing the roster. Reuse requires that broker to have heartbeated once and then gone stale; a row that never connected, one still live, and one with a future heartbeat are never adopted, so concurrent hosts sharing a `machine_id` (a cloned VM, or containers from one image) keep separate identities and credentials. Recorded on the node and returned on roster entries.
                kind:
                  type: string
                  enum: [ws, http_push, poll]
                  default: ws
                  description: Node transport kind. WebSocket nodes use `ws` whether they host one direct agent or many brokered agents.
                role:
                  type: string
                  enum: [direct, broker]
                  description: Node ownership/capability role. Defaults to `broker` for `ws` nodes, and `direct` for `http_push` or `poll` nodes. `direct` nodes bind one agent; `broker` nodes may host multiple agents and use node control frames.
                delivery_adapter:
                  type: string
                  description: Optional adapter identifier. WebSocket nodes default to `ws.node.v1`; HTTP push nodes default from delivery auth.
                delivery:
                  nullable: true
                  oneOf:
                    - $ref: '#/components/schemas/HttpPushNodeDelivery'
                    - type: object
                  description: Required for `http_push`; ignored for broker-controlled WebSocket registrations.
                capabilities:
                  type: array
                  items:
                    type: string
                max_agents:
                  type: integer
                  minimum: 0
                tags:
                  type: array
                  items:
                    type: string
                version:
                  type: string
      responses:
        '201':
          description: Node enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '409':
          description: Node name is already enrolled by a different node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List nodes
      description: List delivery nodes in the workspace, optionally filtered by capability or name. Observer tokens require `nodes:read`; agent filters constrain active-agent details.
      tags:
        - Nodes
      security:
        - workspaceKey: []
        - agentToken: []
        - observerToken: []
      parameters:
        - name: capability
          in: query
          required: false
          schema:
            type: string
        - name: name
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Node roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /nodes/{name}:
    get:
      summary: Get node
      description: Get one node roster entry by name. Observer tokens require `nodes:read`; agent filters constrain active-agent details.
      tags:
        - Nodes
      security:
        - workspaceKey: []
        - agentToken: []
        - observerToken: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node roster entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Node not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /nodes/{name}/agents:
    get:
      summary: List node agent bindings
      description: List active agent bindings for a node. Observer tokens require `nodes:read`; `agent_ids` filters constrain returned bindings.
      tags:
