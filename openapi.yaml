    get:
      summary: Get thread
      description: Get all replies to a message. Observer tokens require `threads:read`, and DM-backed threads also require `dms:read` through DM filters.
      tags:
        - Threads
      security:
        - workspaceKey: []
        - agentToken: []
        - observerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
