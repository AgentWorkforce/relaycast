  # ── Console ─────────────────────────────────────────────────────────
  /console/messages:
    get:
      summary: List console messages
      description: List observability console message logs. Observer tokens require `messages:read`; DM logs also require `dms:read` and DM filters.
      tags: [Console]
      security:
        - workspaceKey: []
        - agentToken: []
        - observerToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: before
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: channel_id
          in: query
          schema:
            type: string
        - name: conversation_id
          in: query
          schema:
            type: string
        - name: delivery_kind
          in: query
          schema:
            type: string
            enum: [channel, dm]
      responses:
        '200':
          description: Console messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsoleMessageLog'

