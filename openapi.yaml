        '201':
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
      summary: List agent session events
      description: List recorded session events for an agent
      tags:
        - Agents
      security:
        - workspaceKey: []
