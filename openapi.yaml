          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /subscriptions:
    post:
      summary: Create outbound event subscription
      description: |
        Subscribe an external webhook endpoint to workspace events. `events` is a free-form array of
        dotted event names (or `["*"]` to receive every event, including new ones such as
        `agent.exited` and `node.status.online` / `node.status.offline`). Delivery payloads are JSON:
        `{ type, workspace_id, timestamp, data }`. If `secret` is provided, Relaycast signs the exact
        JSON request body with HMAC-SHA256 and sends `X-Relay-Signature: sha256=<hex>` along with
        `X-Relay-Event` and `X-Relay-Timestamp`. Custom `headers` are included on delivery; Relay's
        own `Content-Type` and `X-Relay-*` headers take precedence. Header names must be valid
        HTTP field names, values cannot contain CR/LF, and stored custom header values are redacted
        from subscription create/list/get responses.
      tags:
        - Subscriptions
      security:
        - workspaceKey: []
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - events
                - url
              properties:
                events:
                  type: array
                  items:
                    type: string
                filter:
                  type: object
                url:
                  type: string
                headers:
                  type: object
                  additionalProperties:
                    type: string
                  description: Custom headers to include on outbound delivery requests, such as Authorization. Values are redacted in API responses.
                secret:
                  type: string
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
      summary: List subscriptions
      description: List outbound event subscriptions
      tags:
        - Subscriptions
      security:
        - workspaceKey: []
        - agentToken: []
      responses:
        '200':
          description: Subscription list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /subscriptions/{id}:
    get:
      summary: Get subscription
      description: Get outbound event subscription by ID
      tags:
        - Subscriptions
      security:
        - workspaceKey: []
        - agentToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    delete:
      summary: Delete subscription
      description: Delete outbound event subscription
      tags:
        - Subscriptions
      security:
        - workspaceKey: []
        - agentToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Subscription deleted

  /integrations/relayfile/inbound-target:
    post:
      summary: Create relayfile inbound target
      description: >
        Provision a relayfile inbound callback URL and derived HMAC secret for a
        workspace channel/provider/path binding.
      tags:
        - Relayfile
      security:
        - workspaceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayfileInboundTargetRequest'
      responses:
        '201':
          description: Relayfile inbound target created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RelayfileInboundTarget'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Relayfile inbound bridge is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /integrations/relayfile/inbound/{workspaceId}/{channelId}:
    post:
      summary: Receive relayfile inbound event
      description: >
        HMAC-authenticated callback used by relayfile to inject matching provider
        file events into a Relaycast channel. The HMAC input is
        `X-Relay-Timestamp + "." + raw request body`, signed with SHA-256.
      tags:
        - Relayfile
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: provider
          in: query
          required: true
          schema:
            type: string
        - name: path_glob
          in: query
          required: true
          schema:
            type: string
        - name: X-Relay-Timestamp
          in: header
          required: true
          schema:
            type: string
        - name: X-Relay-Signature
          in: header
          required: true
          schema:
            type: string
          description: Hex HMAC-SHA256 signature, optionally prefixed with `sha256=`.
        - name: X-Relay-Event-Id
          in: header
          required: false
          schema:
            type: string
          description: Stable delivery id used for idempotency. If omitted, `eventId` from the JSON body is used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayfileInboundEvent'
      responses:
        '201':
          description: Event delivered as a Relaycast message
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RelayfileInboundDeliveryResult'
        '200':
          description: Event accepted but skipped
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RelayfileInboundSkipResult'
        '400':
          description: Invalid route parameters, JSON, or event body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid relayfile signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Event body exceeds the relayfile inbound size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Transient delivery failure; relayfile should retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Relayfile inbound bridge or idempotency storage is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /webhooks:
    post:
      summary: Create inbound webhook
      description: >
        Create an authenticated inbound webhook that posts to a channel. The response includes an
        absolute `url` and a one-time-visible bearer `token`; callers must send
        `Authorization: Bearer <token>` to the hook URL.
      tags:
        - Webhooks
      security:
        - workspaceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel
              properties:
                name:
                  type: string
                  description: Optional display name. Defaults to the generated webhook ID.
                channel:
                  type: string
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
      summary: List inbound webhooks
      description: List inbound webhooks for workspace
      tags:
        - Webhooks
      security:
        - workspaceKey: []
      responses:
        '200':
          description: Webhook list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /webhooks/{id}:
    delete:
      summary: Delete inbound webhook
      description: Delete inbound webhook by ID
      tags:
        - Webhooks
      security:
        - workspaceKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Webhook deleted

  /hooks/{webhookId}:
    post:
      summary: Trigger inbound webhook
      description: Trigger a configured inbound webhook. Requires the per-webhook bearer token returned by `POST /webhooks`. Accepts either `{ message, author }` (SDK shape) or `{ text, source, payload }`; `message` maps to message text and `author` is used as the displayed sender without being copied into `source`.
      tags:
        - Webhooks
      security:
        - webhookToken: []
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Message text. `message` is also accepted.
                message:
                  type: string
                  description: SDK alias for `text`.
                source:
                  type: string
                  description: Origin source identifier for the webhook event.
                author:
                  type: string
                  description: Displayed sender for the resulting channel message.
                payload:
                  type: object
      responses:
        '201':
          description: Webhook delivered as message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /ws:
    get:
      summary: Workspace observer WebSocket stream
      description: Upgrade to the workspace observer realtime stream with an `ot_live_*` token that has `stream:read`. Workspace, agent, and node tokens cannot open this stream; agent SDK realtime uses `/v1/node/ws` with a direct node token. The token is supplied via the `token` query parameter; this endpoint does not read an Authorization header. Query-param tokens can appear in access logs. `file.uploaded` is emitted at upload completion before channel or DM attachment exists; channel and DM visibility are enforced on file REST reads and message attachment reads.
      tags:
        - System
      security:
        - observerToken: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Observer token (`ot_live_*`) with `stream:read`. This is the only accepted credential for this endpoint; the upgrade reads it from the query string and ignores any Authorization header.
      responses:
        '101':
          description: Switching Protocols (WebSocket)
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── A2A ──────────────────────────────────────────────────────────────
  /.well-known/agent-card.json:
    servers:
      - url: https://cast.agentrelay.com
        description: Production server (root, no /v1 prefix)
      - url: http://localhost:8787
        description: Local development server
    get:
      summary: Workspace A2A agent card
      description: >
        Unauthenticated A2A discovery. The workspace is resolved in order:
        Authorization header, `?workspace=` query parameter, an explicit
        `/:workspace/` path segment, then the first host label (the hosted
        workspace-per-subdomain convention). A deployment holding exactly one
        workspace answers this bare path with that workspace; a deployment
        holding more than one resolves only if one of those mechanisms names a
        workspace — a valid workspace subdomain is sufficient on its own — and
        otherwise returns 404. An explicit query or path selector that does not
        resolve always returns 404 rather than falling back to any other
        workspace.
      tags: [A2A]
      parameters:
        - in: query
          name: workspace
          required: false
          schema:
            type: string
          description: >
            Workspace name. Needed on a deployment holding more than one
            workspace unless the request host already identifies one — a valid
            workspace subdomain resolves without it.
      responses:
        '200':
          description: Agent card JSON
          content:
            application/json:
              schema:
                type: object
        '404':
          description: >
            `workspace_not_found` — no selector resolved a workspace, or an
            explicit selector named one that does not exist.
          content:
            application/json:
              schema:
                type: object

  /{workspace}/.well-known/agent-card.json:
    servers:
      - url: https://cast.agentrelay.com
        description: Production server (root, no /v1 prefix)
      - url: http://localhost:8787
        description: Local development server
    get:
      summary: Workspace A2A agent card, path-scoped
      description: >
        Path-scoped form of A2A discovery. The path segment takes precedence
        over host-label inference, so this route resolves on multi-label
        authorities. A segment naming a workspace that does not exist returns
        404 rather than falling back to any other workspace.
      tags: [A2A]
      parameters:
        - in: path
          name: workspace
          required: true
          schema:
            type: string
          description: Workspace name.
      responses:
        '200':
          description: Agent card JSON
          content:
            application/json:
              schema:
                type: object
        '404':
          description: '`workspace_not_found` — the named workspace does not exist.'
          content:
            application/json:
              schema:
                type: object

  /a2a/register:
    post:
      summary: Register an external A2A agent
      tags: [A2A]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_card_url:
                  type: string
                  format: uri
                agent_card:
                  type: object
                auth_scheme:
                  type: string
                  enum: [bearer, api_key, none]
                auth_credential:
                  type: string
                target_agent:
                  type: string
                  description: >-
                    Remote card skill that DMs to the local proxy address. It
                    is inferred when the card advertises exactly one skill.
      responses:
        '201':
          description: Agent registered
          content:
            application/json:
              schema:
                type: object

  /a2a/agents:
    get:
      summary: List registered A2A agents
      tags: [A2A]
      responses:
        '200':
          description: List of A2A agents
          content:
            application/json:
              schema:
                type: object

  /a2a/agents/{name}:
    patch:
      summary: Complete or rotate an A2A connection
      description: >-
        Updates the outbound credential or selected remote skill without
        rotating the inbound relay token. Use this after reciprocal
        registration to complete authenticated delivery in both directions.
      tags: [A2A]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                auth_scheme:
                  type: string
                  enum: [bearer, api_key, none]
                auth_credential:
                  type: string
                  nullable: true
                target_agent:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Connection updated
          content:
            application/json:
              schema:
                type: object
    delete:
      summary: Remove an A2A agent
      tags: [A2A]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent removed
          content:
            application/json:
              schema:
                type: object

  /a2a/agents/{name}/card:
    get:
      summary: Get agent card for a registered A2A agent
      tags: [A2A]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent card
          content:
            application/json:
              schema:
                type: object

  /a2a/rpc:
    servers:
      - url: https://cast.agentrelay.com
        description: Production server (root, no /v1 prefix)
      - url: http://localhost:8787
        description: Local development server
    post:
      summary: JSON-RPC gateway for A2A messages
      description: >-
        Sends to a registered external A2A agent or, when authenticated with
        the bearer token issued by A2A registration, delivers to a local agent.
        Ratify envelopes use
        `params.message.metadata["com.agentrelay.ratify"]`; see
        `docs/a2a-ratify-federation.md` for the version 1 shapes.
      tags: [A2A]
      responses:
        '200':
          description: JSON-RPC response
          content:
            application/json:
              schema:
                type: object

  /a2a/webhook/{workspace_id}/{name}:
    servers:
      - url: https://cast.agentrelay.com
        description: Production server (root, no /v1 prefix)
      - url: http://localhost:8787
        description: Local development server
