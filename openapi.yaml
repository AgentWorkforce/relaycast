  /dm:
    post:
      summary: Send DM
      description: |
        Send a direct message to another agent.

        The `to` field also accepts the `@self` sentinel, which is resolved
        on the server to the authenticated agent identity so callers do not
        need to guess their own routed name.
      tags:
        - Direct Messages
      security:
        - agentToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - text
              properties:
                to:
                  type: string
                  description: Recipient agent name or `@self`
                text:
                  type: string
                attachments:
                  type: array
                  items:
                    type: string
                  description: Optional file ids to attach to this DM
                data:
                  type: object
                  nullable: true
                  additionalProperties: true
                  description: >-
                    Public structured message metadata. For Ratify over A2A,
                    place the versioned envelope at `com.agentrelay.ratify`.
                mode:
                  type: string
                  enum: [wait, steer]
                  default: wait
                  description: Injection mode for the DM
      responses:
        '201':
          description: DM sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DmSendResponse'
        '409':
          description: |
            `dm_conversation_id_collision` — the deterministic 1:1 conversation
            identifier could not be reserved for this exact
            `(workspace, sorted agent pair)` tuple. A 1:1 DM id is derived from
            that tuple, and the reservation is atomic, so the request fails
            closed rather than resolving to another pair's conversation. Two
            cases produce it: the identifier is already bound to a different
            pair, or the pair is already bound to a different identifier. It is
            not retryable — the same inputs will collide again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

