          description: Event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /subscriptions:
    post:
      summary: Create outbound event subscription
      description: |
        Subscribe an external webhook endpoint to workspace events. Delivery payloads are JSON:
        `{ type, workspace_id, timestamp, data }`. If `secret` is provided, Relaycast signs the exact
        JSON request body with HMAC-SHA256 and sends `X-Relay-Signature: sha256=<hex>` along with
        `X-Relay-Event` and `X-Relay-Timestamp`. Custom `headers` are included on delivery; Relay's
        own `Content-Type` and `X-Relay-*` headers take precedence. Header names must be valid
        HTTP field names, values cannot contain CR/LF, and stored custom header values are redacted
        from subscription create/list/get responses.
      tags:
        - Subscriptions
      security:
        - workspaceKey: []
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - events
                - url
              properties:
                events:
                  type: array
                  items:
                    type: string
                filter:
                  type: object
                url:
                  type: string
                headers:
                  type: object
                  additionalProperties:
                    type: string
                  description: Custom headers to include on outbound delivery requests, such as Authorization. Values are redacted in API responses.
                secret:
                  type: string
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
      summary: List subscriptions
      description: List outbound event subscriptions
      tags:
        - Subscriptions
      security:
        - workspaceKey: []
        - agentToken: []
      responses:
        '200':
          description: Subscription list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /subscriptions/{id}:
    get:
      summary: Get subscription
      description: Get outbound event subscription by ID
      tags:
        - Subscriptions
      security:
        - workspaceKey: []
        - agentToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    delete:
      summary: Delete subscription
      description: Delete outbound event subscription
      tags:
        - Subscriptions
      security:
        - workspaceKey: []
        - agentToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Subscription deleted

  /webhooks:
    post:
      summary: Create inbound webhook
      description: >
        Create an authenticated inbound webhook that posts to a channel. The response includes an
        absolute `url` and a one-time-visible bearer `token`; callers must send
        `Authorization: Bearer <token>` to the hook URL.
      tags:
        - Webhooks
      security:
        - workspaceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel
              properties:
                name:
                  type: string
                  description: Optional display name. Defaults to the generated webhook ID.
                channel:
                  type: string
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
    get:
      summary: List inbound webhooks
      description: List inbound webhooks for workspace
      tags:
        - Webhooks
      security:
        - workspaceKey: []
      responses:
        '200':
          description: Webhook list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /webhooks/{id}:
    delete:
      summary: Delete inbound webhook
      description: Delete inbound webhook by ID
      tags:
        - Webhooks
      security:
        - workspaceKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Webhook deleted

  /hooks/{webhookId}:
    post:
      summary: Trigger inbound webhook
      description: Trigger a configured inbound webhook. Requires the per-webhook bearer token returned by `POST /webhooks`. Accepts either `{ message, author }` (SDK shape) or `{ text, source, payload }`; `message` maps to message text and `author` is used as the displayed sender without being copied into `source`.
      tags:
        - Webhooks
      security:
        - webhookToken: []
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Message text. `message` is also accepted.
                message:
                  type: string
                  description: SDK alias for `text`.
                source:
                  type: string
                  description: Origin source identifier for the webhook event.
                author:
                  type: string
                  description: Displayed sender for the resulting channel message.
                payload:
                  type: object
      responses:
        '201':
          description: Webhook delivered as message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /ws:
    get:
      summary: WebSocket stream
      description: Upgrade to workspace or agent realtime stream via token query parameter
      tags:
        - System
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Agent token (`at_live_*`) or workspace key (`rk_live_*`)
      responses:
        '101':
          description: Switching Protocols (WebSocket)
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

