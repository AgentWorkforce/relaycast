name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build: 'true'
      - run: npx turbo lint
      - run: npx turbo test
        env:
          DO_NOT_TRACK: '1'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build: 'true'
      - uses: ./.github/actions/apply-d1-migrations
        with:
          migration-worker-name: relaycast-d1-migrate-staging
          database-id: ${{ vars.STAGING_D1_DATABASE_ID }}
          database-name: relaycast-staging
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Resolve server version
        id: server_version
        shell: bash
        run: |
          echo "semver=$(node -p 'require("./packages/server/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/deploy-worker
        with:
          worker-name: relaycast-api-staging
          environment: staging
          route: 'staging-api.relaycast.dev/*'
          extra-vars: |
            APP_SEMVER = "${{ steps.server_version.outputs.semver }}"
            APP_VERSION = "${{ github.sha }}"
          d1-database-id: ${{ vars.STAGING_D1_DATABASE_ID }}
          kv-id: ${{ vars.STAGING_KV_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke-test-staging:
    name: Smoke + E2E Test Staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build: 'true'
      - uses: ./.github/actions/smoke-test
        with:
          base-url: https://staging-api.relaycast.dev
      - name: Run E2E smoke test (staging)
        timeout-minutes: 15
        run: npm run e2e -- https://staging-api.relaycast.dev --ci

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: smoke-test-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build: 'true'
      - uses: ./.github/actions/apply-d1-migrations
        with:
          migration-worker-name: relaycast-d1-migrate-production
          database-id: ${{ vars.PRODUCTION_D1_DATABASE_ID }}
          database-name: relaycast
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Resolve server version
        id: server_version
        shell: bash
        run: |
          echo "semver=$(node -p 'require("./packages/server/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Sync PostHog API key secret (production)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${POSTHOG_API_KEY:-}" ]; then
            echo "POSTHOG_API_KEY GitHub secret is not set."
            exit 1
          fi
          echo "$POSTHOG_API_KEY" | npx wrangler secret put POSTHOG_API_KEY --name relaycast-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      - uses: ./.github/actions/deploy-worker
        with:
          worker-name: relaycast-api
          environment: production
          route: 'api.relaycast.dev/*'
          extra-vars: |
            APP_SEMVER = "${{ steps.server_version.outputs.semver }}"
            APP_VERSION = "${{ github.sha }}"
          d1-database-id: ${{ vars.PRODUCTION_D1_DATABASE_ID }}
          kv-id: ${{ vars.PRODUCTION_KV_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-observer-pages:
    name: Deploy Observer Dashboard
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build: 'true'
      - uses: ./.github/actions/deploy-observer-dashboard
        with:
          branch: main
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-observer-router:
    name: Deploy Observer Host Router
    runs-on: ubuntu-latest
    needs: deploy-observer-pages
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Deploy observer hostname router worker
        run: npx wrangler deploy --config wrangler.observer-router.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject PostHog API key into marketing site
        shell: bash
        env:
          RELAYCAST_POSTHOG_API_KEY: ${{ secrets.RELAYCAST_POSTHOG_API_KEY }}
        run: |
          # The committed site/index.html contains a __RELAYCAST_POSTHOG_API_KEY__
          # placeholder so that forks and local previews never accidentally send
          # telemetry to our production PostHog project. Substitute the real key
          # here when (and only when) the GitHub Actions secret is present.
          if [ -z "${RELAYCAST_POSTHOG_API_KEY:-}" ]; then
            echo "RELAYCAST_POSTHOG_API_KEY secret is not set; marketing site will ship without telemetry."
          else
            # Use a Node script to do a literal replacement (avoids shell escaping
            # surprises and works even if the key ever contains regex-special chars).
            node -e "
              const fs = require('fs');
              const path = 'site/index.html';
              const key = process.env.RELAYCAST_POSTHOG_API_KEY;
              const src = fs.readFileSync(path, 'utf8');
              if (!src.includes('__RELAYCAST_POSTHOG_API_KEY__')) {
                console.error('Placeholder __RELAYCAST_POSTHOG_API_KEY__ not found in ' + path);
                process.exit(1);
              }
              fs.writeFileSync(path, src.split('__RELAYCAST_POSTHOG_API_KEY__').join(key));
              console.log('Substituted PostHog key into ' + path);
            "
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/ --project-name=relaycast

  deploy-smithery:
    name: Deploy MCP to Smithery
    runs-on: ubuntu-latest
    needs: deploy-production
    timeout-minutes: 20
    steps:
      - name: Warm up MCP endpoint
        run: |
          sleep 15
          for i in $(seq 1 10); do
            RESP=$(curl -s -D /tmp/mcp-headers -X POST 'https://api.relaycast.dev/mcp' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --max-time 10 \
              -d '{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"warmup","version":"1.0.0"}},"id":1}' 2>/dev/null)
            if echo "$RESP" | grep -q '"tools"'; then
              echo "Initialize OK after $i attempts"
              break
            fi
            echo "Attempt $i: waiting for MCP..."
            sleep 5
          done

          SESSION_ID=$(grep -i 'mcp-session-id' /tmp/mcp-headers | tr -d '\r' | awk '{print $2}')
          if [ -n "$SESSION_ID" ]; then
            curl -s -X POST 'https://api.relaycast.dev/mcp' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -H "Mcp-Session-Id: $SESSION_ID" \
              --max-time 5 \
              -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' 2>/dev/null > /dev/null

            TOOLS_RESP=$(curl -s -X POST 'https://api.relaycast.dev/mcp' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -H "Mcp-Session-Id: $SESSION_ID" \
              --max-time 15 \
              -d '{"jsonrpc":"2.0","method":"tools/list","params":{},"id":2}' 2>/dev/null)
            TOOL_COUNT=$(echo "$TOOLS_RESP" | grep -o '"name":"[^"]*"' | wc -l)
            echo "tools/list warm-up returned $TOOL_COUNT name fields ($(echo "$TOOLS_RESP" | wc -c) bytes)"
          else
            echo "Warning: No session ID from initialize"
          fi

      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Publish to Smithery (with retry)
        run: |
          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt of 5 ==="
            OUTPUT=$(npx @smithery/cli@3 publish \
              -u https://api.relaycast.dev/mcp \
              -n "relaycast/relay" \
              -k "$SMITHERY_API_KEY" \
              --config-schema packages/mcp/smithery-config-schema.json 2>&1) || true
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "39 tools" && echo "$OUTPUT" | grep -q "1 prompt"; then
              echo "Full capabilities detected (39 tools + 1 prompt)!"
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Attempt $attempt: Incomplete scan, retrying in 30 seconds..."
              sleep 30
            else
              echo "All 5 attempts completed without full detection."
            fi
          done
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
