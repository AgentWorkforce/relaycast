name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx turbo lint

      - name: Build
        run: npx turbo build

      - name: Test
        run: npx turbo test
        env:
          DO_NOT_TRACK: '1'

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --config deploy/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-pages:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/ --project-name=relaycast

  deploy-smithery:
    name: Deploy MCP to Smithery
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for Fly.io instances to warm up
        run: sleep 30

      - name: Verify MCP endpoint is ready
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              https://api.relaycast.dev/mcp \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"health-check","version":"1.0.0"}},"id":1}')
            if [ "$STATUS" = "200" ]; then
              echo "MCP endpoint ready after $i attempts"
              break
            fi
            echo "Attempt $i: MCP returned $STATUS, waiting..."
            sleep 5
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish to Smithery (with retry)
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            OUTPUT=$(npx @smithery/cli@latest publish \
              -u https://api.relaycast.dev/mcp \
              -n "relaycast/relay" \
              -k "$SMITHERY_API_KEY" \
              --config-schema packages/mcp/smithery-config-schema.json 2>&1)
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "37 tools" && echo "$OUTPUT" | grep -q "1 prompt"; then
              echo "Full capabilities detected (37 tools + 1 prompt)!"
              break
            fi
            echo "Attempt $attempt: Incomplete scan (missing tools or prompts), retrying in 15 seconds..."
            sleep 15
          done
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
