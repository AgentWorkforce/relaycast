name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx turbo lint

      - name: Build
        run: npx turbo build

      - name: Test
        run: npx turbo test
        env:
          DO_NOT_TRACK: '1'

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --config deploy/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-pages:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/ --project-name=relaycast

  deploy-smithery:
    name: Deploy MCP to Smithery
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for Fly.io instances to warm up
        run: sleep 30

      - name: Warm up MCP endpoint (initialize + tools/list)
        run: |
          # Step 1: Wait for initialize to work
          for i in $(seq 1 10); do
            RESP=$(curl -s -D /tmp/mcp-headers -X POST 'https://api.relaycast.dev/mcp' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --max-time 10 \
              -d '{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"warmup","version":"1.0.0"}},"id":1}' 2>/dev/null)
            if echo "$RESP" | grep -q '"tools"'; then
              echo "Initialize OK after $i attempts"
              break
            fi
            echo "Attempt $i: waiting for MCP..."
            sleep 5
          done

          # Step 2: Extract session ID and warm up tools/list (the 39KB payload Smithery needs)
          SESSION_ID=$(grep -i 'mcp-session-id' /tmp/mcp-headers | tr -d '\r' | awk '{print $2}')
          if [ -n "$SESSION_ID" ]; then
            curl -s -X POST 'https://api.relaycast.dev/mcp' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -H "Mcp-Session-Id: $SESSION_ID" \
              --max-time 5 \
              -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' 2>/dev/null > /dev/null

            TOOLS_RESP=$(curl -s -X POST 'https://api.relaycast.dev/mcp' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -H "Mcp-Session-Id: $SESSION_ID" \
              --max-time 15 \
              -d '{"jsonrpc":"2.0","method":"tools/list","params":{},"id":2}' 2>/dev/null)
            TOOL_COUNT=$(echo "$TOOLS_RESP" | grep -o '"name":"[^"]*"' | wc -l)
            echo "tools/list warm-up returned $TOOL_COUNT name fields ($(echo "$TOOLS_RESP" | wc -c) bytes)"
          else
            echo "Warning: No session ID from initialize"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish to Smithery (with retry)
        run: |
          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt of 5 ==="
            OUTPUT=$(npx @smithery/cli@3 publish \
              -u https://api.relaycast.dev/mcp \
              -n "relaycast/relay" \
              -k "$SMITHERY_API_KEY" \
              --config-schema packages/mcp/smithery-config-schema.json 2>&1) || true
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "39 tools" && echo "$OUTPUT" | grep -q "1 prompt"; then
              echo "Full capabilities detected (39 tools + 1 prompt)!"
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Attempt $attempt: Incomplete scan, retrying in 30 seconds..."
              sleep 30
            else
              echo "All 5 attempts completed without full detection."
            fi
          done
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
