name: Publish Container

# Publishes the self-host engine image to GHCR and prints the immutable digest.
#
# Manual only. A published image is what another company pins and runs, so it
# should be a deliberate act rather than a side effect of merging.
#
# Authentication is the built-in GITHUB_TOKEN — no registry account to create
# and no secret to rotate. `packages: write` is what lets it push.
#
# NOTE: a package created by Actions starts PRIVATE even from a public repo.
# After the first successful run, set the package to public once in
# Settings → Packages → relaycast-self-host → Change visibility. Every later
# push inherits that setting.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag: the pinned engine version (e.g. 12.2.1), or that version plus a build suffix (e.g. 12.2.1-selfhost.1) for an image built from unreleased source on this ref"
        required: true
        type: string
      latest:
        description: "Also tag as :latest (released versions only: an unsuffixed tag from main or its v<version> tag)"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-container
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The tag must match the engine version the image actually installs.
      # Version skew between the two ends of a federation is the run-stopper a
      # dry run exists to catch, so it is checked here rather than trusted.
      # GHCR repository names must be lowercase, and the org is "AgentWorkforce".
      # buildx rejects the tag outright rather than normalising it.
      - name: Lowercase the owner for the image name
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Verify the tag matches the pinned engine version
        id: pin
        env:
          TAG: ${{ inputs.tag }}
          LATEST: ${{ inputs.latest }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          pinned="$(node -p "require('./docker/package.json').dependencies['@relaycast/engine']")"
          # The image builds the engine from this checkout over the pinned npm
          # package. A suffixed tag (<pinned>-<suffix>) names an image whose
          # source is ahead of the last npm release, without claiming a
          # version that was never released.
          case "$TAG" in
            "$pinned") ;;
            "$pinned"-*)
              if ! printf '%s' "${TAG#"$pinned"-}" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.-]*$'; then
                echo "tag suffix in '$TAG' must be [0-9A-Za-z.-]" >&2
                exit 1
              fi
              ;;
            *)
              echo "tag '$TAG' does not match the pinned engine version '$pinned' (or '$pinned-<suffix>')" >&2
              exit 1
              ;;
          esac
          # The plain version tag and :latest are what customers pin and pull, so
          # they may only name a released build: main or the release tag itself.
          # A suffixed tag from any other ref stays possible for unreleased source.
          released_ref=false
          case "$REF" in
            refs/heads/main|"refs/tags/v$pinned") released_ref=true ;;
          esac
          if [ "$TAG" != "$pinned" ] && [ "$LATEST" = "true" ]; then
            echo "refusing :latest for suffixed tag '$TAG': :latest names a released version only" >&2
            exit 1
          fi
          if [ "$released_ref" != "true" ]; then
            if [ "$TAG" = "$pinned" ]; then
              echo "refusing release tag '$TAG' from $REF: publish it from main or refs/tags/v$pinned, or add a suffix" >&2
              exit 1
            fi
            if [ "$LATEST" = "true" ]; then
              echo "refusing :latest from $REF: publish it from main or refs/tags/v$pinned" >&2
              exit 1
            fi
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "tag $TAG matches pinned engine version: $pinned"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: RELAYCAST_ENGINE_VERSION=${{ steps.pin.outputs.pinned }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/relaycast-self-host:${{ inputs.tag }}
            ${{ inputs.latest && format('ghcr.io/{0}/relaycast-self-host:latest', env.OWNER_LC) || '' }}

      - name: Report the immutable reference
        env:
          OWNER: ${{ env.OWNER_LC }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## Published"
            echo
            echo '```'
            echo "ghcr.io/${OWNER}/relaycast-self-host:${TAG}"
            echo "ghcr.io/${OWNER}/relaycast-self-host@${DIGEST}"
            echo '```'
            echo
            echo "Pin the digest, not the tag — a tag can be moved, a digest cannot."
            echo "Platforms: linux/amd64, linux/arm64"
            echo "Source commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
