name: Publish Container

# Publishes the self-host engine image to GHCR and prints the immutable digest.
#
# Manual only. A published image is what another company pins and runs, so it
# should be a deliberate act rather than a side effect of merging.
#
# Authentication is the built-in GITHUB_TOKEN — no registry account to create
# and no secret to rotate. `packages: write` is what lets it push.
#
# NOTE: a package created by Actions starts PRIVATE even from a public repo.
# After the first successful run, set the package to public once in
# Settings → Packages → relaycast-self-host → Change visibility. Every later
# push inherits that setting.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag: the pinned engine version (e.g. 12.2.1), or that version plus a build suffix (e.g. 12.2.1-selfhost.1) for an image built from unreleased source on this ref"
        required: true
        type: string
      latest:
        description: "Also tag as :latest. Only an unsuffixed tag built from the v<version> release commit on main may move it."
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-container
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # A customer image must be built from a reviewed commit on main, and be
      # dispatched from main: the attestation records the dispatch ref, and
      # the verify command in the summary pins --source-ref refs/heads/main.
      - name: Verify the source commit is reviewed on main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Refusing to publish from ${GITHUB_REF}: dispatch this workflow from main" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$(git rev-parse "${GITHUB_SHA}^{commit}")" origin/main; then
            echo "Refusing to publish ${GITHUB_SHA}: it is not on main" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The tag must match the engine version the image actually installs.
      # Version skew between the two ends of a federation is the run-stopper a
      # dry run exists to catch, so it is checked here rather than trusted.
      # GHCR repository names must be lowercase, and the org is "AgentWorkforce".
      # buildx rejects the tag outright rather than normalising it.
      - name: Lowercase the owner for the image name
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Verify the tag matches the pinned engine version
        id: pin
        env:
          TAG: ${{ inputs.tag }}
          LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          pinned="$(node -p "require('./docker/package.json').dependencies['@relaycast/engine']")"
          # The image builds the engine from this checkout over the pinned npm
          # package. A suffixed tag (<pinned>-<suffix>) names an image whose
          # source is ahead of the last npm release, without claiming a
          # version that was never released.
          case "$TAG" in
            "$pinned") ;;
            "$pinned"-*)
              if ! printf '%s' "${TAG#"$pinned"-}" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z.-]*$'; then
                echo "tag suffix in '$TAG' must be [0-9A-Za-z.-]" >&2
                exit 1
              fi
              ;;
            *)
              echo "tag '$TAG' does not match the pinned engine version '$pinned' (or '$pinned-<suffix>')" >&2
              exit 1
              ;;
          esac
          # The image compiles the engine from this checkout, and main keeps the
          # pinned version after a release while its source moves on. The plain
          # version tag and :latest are what customers pin, so they publish only
          # when this commit is the v<pinned> release. Dispatch stays on main
          # (checked above). A suffixed tag names later source and cannot move
          # :latest.
          if [ "$TAG" != "$pinned" ] && [ "$LATEST" = "true" ]; then
            echo "refusing :latest for suffixed tag '$TAG': :latest names a released version only" >&2
            exit 1
          fi
          if [ "$TAG" = "$pinned" ] || [ "$LATEST" = "true" ]; then
            if ! git fetch --no-tags origin "refs/tags/v${pinned}:refs/tags/v${pinned}"; then
              echo "refusing to publish '$TAG': release tag refs/tags/v${pinned} is not on origin" >&2
              exit 1
            fi
            release_sha="$(git rev-parse "refs/tags/v${pinned}^{commit}")"
            checkout_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
            if [ "$checkout_sha" != "$release_sha" ]; then
              echo "refusing to publish '$TAG' from ${checkout_sha}: the plain version tag and :latest require this main checkout to be the v${pinned} release commit (${release_sha}). Add a suffix and leave :latest off." >&2
              exit 1
            fi
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "tag $TAG matches pinned engine version: $pinned"

      # Push by digest only. The version tag and :latest are added after the
      # signed attestation succeeds, so no public tag ever names an image
      # without one. A failed attestation leaves only an untagged digest.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ env.OWNER_LC }}/relaycast-self-host,push-by-digest=true,name-canonical=true,push=true
          build-args: RELAYCAST_ENGINE_VERSION=${{ steps.pin.outputs.pinned }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Customer releases need an SBOM and verifiable (max-mode)
          # provenance; the signed GitHub attestation below covers the digest.
          provenance: mode=max
          sbom: true

      - name: Attest published image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ env.OWNER_LC }}/relaycast-self-host
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # imagetools copies the index bytes for a single source, so each tag
      # resolves to the attested digest; the check below fails the run if not.
      - name: Tag the attested digest
        env:
          IMAGE: ghcr.io/${{ env.OWNER_LC }}/relaycast-self-host
          TAG: ${{ inputs.tag }}
          LATEST: ${{ inputs.latest }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          names=("$TAG")
          if [ "$LATEST" = "true" ]; then names+=(latest); fi
          args=()
          for t in "${names[@]}"; do args+=(-t "${IMAGE}:${t}"); done
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          for t in "${names[@]}"; do
            got="$(docker buildx imagetools inspect "${IMAGE}:${t}" --format '{{json .Manifest}}' | jq -r .digest)"
            if [ "$got" != "$DIGEST" ]; then
              echo "${IMAGE}:${t} resolves to ${got}, expected the attested ${DIGEST}" >&2
              exit 1
            fi
          done

      - name: Report the immutable reference
        env:
          OWNER: ${{ env.OWNER_LC }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## Published"
            echo
            echo '```'
            echo "ghcr.io/${OWNER}/relaycast-self-host:${TAG}"
            echo "ghcr.io/${OWNER}/relaycast-self-host@${DIGEST}"
            echo '```'
            echo
            echo "Pin the digest, not the tag — a tag can be moved, a digest cannot."
            echo "Platforms: linux/amd64, linux/arm64"
            echo "Source commit: ${GITHUB_SHA}"
            echo
            echo "Verify it was built from main by this workflow:"
            echo
            echo '```'
            echo "gh attestation verify oci://ghcr.io/${OWNER}/relaycast-self-host@${DIGEST} \\"
            echo "  --repo ${GITHUB_REPOSITORY} --source-ref refs/heads/main \\"
            echo "  --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/publish-container.yml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
