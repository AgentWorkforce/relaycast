name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # NOTE: The per-PR API preview deployed the legacy @relaycast/server worker, which
  # has been removed from this repo (superseded by @relaycast/engine). PR validation
  # now runs the engine e2e locally in the `ci` workflow. The cleanup job below stays
  # so any lingering preview workers from older PRs are still torn down on close.

  cleanup-preview:
    name: Cleanup Preview
    if: github.event.action == 'closed' && (github.event.pull_request.merged == true || github.event.pull_request.state == 'closed') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete preview workers
        shell: bash
        run: |
          set -euo pipefail
          PR_NUM="${{ github.event.pull_request.number }}"
          for worker in "relaycast-pr-${PR_NUM}" "relaycast-observer-pr-${PR_NUM}"; do
            echo "Deleting ${worker}"
            if ! npx wrangler delete --name "${worker}" --force; then
              echo "Unable to delete ${worker} (already removed or not found)."
            fi
          done
