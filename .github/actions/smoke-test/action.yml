name: Smoke Test
description: Health check and basic API verification against a deployed environment

inputs:
  base-url:
    description: 'Base URL to test (e.g. https://staging-api.relaycast.dev)'
    required: true
  retries:
    description: Number of health check retries
    default: '5'
  wait-seconds:
    description: Initial wait for Workers propagation
    default: '10'

runs:
  using: composite
  steps:
    - name: Wait for Workers to propagate
      shell: bash
      run: sleep ${{ inputs.wait-seconds }}

    - name: Health check
      shell: bash
      run: |
        for i in $(seq 1 ${{ inputs.retries }}); do
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' ${{ inputs.base-url }}/health)
          if [ "$STATUS" = "200" ]; then
            echo "Health check passed on attempt $i"
            exit 0
          fi
          echo "Attempt $i: got $STATUS, retrying..."
          sleep 5
        done
        echo "Health check failed after ${{ inputs.retries }} attempts"
        exit 1

    - name: API smoke test
      shell: bash
      run: |
        RESP=$(curl -s ${{ inputs.base-url }}/health)
        echo "Response: $RESP"
        if echo "$RESP" | grep -q '"ok"'; then
          echo "Smoke test passed"
        else
          echo "Unexpected response format"
          exit 1
        fi
