name: Apply D1 Migrations
description: Apply remote D1 migrations for a target Cloudflare database

inputs:
  migration-worker-name:
    description: Temporary worker name used for migration config
    required: true
  database-id:
    description: Cloudflare D1 database ID
    required: true
  database-name:
    description: Cloudflare D1 database name
    required: true
  cloudflare-api-token:
    description: Cloudflare API token
    required: true
  cloudflare-account-id:
    description: Cloudflare account ID
    required: true

runs:
  using: composite
  steps:
    - name: Apply migrations
      shell: bash
      run: |
        set -euo pipefail

        DB_ID="${{ inputs.database-id }}"
        if [ -z "$DB_ID" ]; then
          echo "Missing required database-id input."
          exit 1
        fi

        WS="${GITHUB_WORKSPACE:-$PWD}"
        CFG="$(mktemp /tmp/wrangler-d1-XXXX.toml)"
        cat > "$CFG" <<EOF
        name = "${{ inputs.migration-worker-name }}"
        main = "${WS}/packages/server/src/worker.ts"
        compatibility_date = "2024-12-01"

        [[d1_databases]]
        binding = "DB"
        database_name = "${{ inputs.database-name }}"
        database_id = "${DB_ID}"
        migrations_dir = "${WS}/packages/server/src/db/migrations"
        EOF

        npx wrangler d1 migrations apply DB --remote --config "$CFG"
        rm -f "$CFG"
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
