name: Deploy Observer Dashboard
description: Build the observer dashboard with the OpenNext Cloudflare adapter and deploy it as a Worker

inputs:
  cloudflare-api-token:
    description: Cloudflare API token
    required: true
  cloudflare-account-id:
    description: Cloudflare account ID
    required: true

runs:
  using: composite
  steps:
    - name: Deploy dashboard worker
      shell: bash
      run: npm run -w @relaycast/observer-dashboard deploy
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
