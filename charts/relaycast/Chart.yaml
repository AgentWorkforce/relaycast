apiVersion: v2
name: relaycast
description: >-
  Self-hosted Relaycast engine (Node + SQLite). SINGLE PROCESS ONLY: realtime
  fan-out, presence, sequences and rate limits live in process memory, so this
  chart always runs exactly one replica with a Recreate rollout and a
  ReadWriteOnce volume. Do not scale it out.
