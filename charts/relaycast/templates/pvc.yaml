{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "relaycast.claimName" . }}
  labels:
    {{- include "relaycast.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.persistence.annotations | default dict) }}
  {{- if .Values.persistence.retainOnUninstall }}
  {{- $_ := set $annotations "helm.sh/resource-policy" "keep" }}
  {{- else }}
  {{- $_ := unset $annotations "helm.sh/resource-policy" }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
