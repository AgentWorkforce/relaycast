# Relaycast self-host chart.
#
# SINGLE PROCESS ONLY. The engine keeps WebSocket connections, presence,
# realtime sequence counters, idempotency windows and rate-limit buckets in
# process memory, and stores everything else in one SQLite file. Two pods
# would split-brain. The Deployment is pinned to replicas: 1 with a Recreate
# strategy (the old pod releases the volume before the new one starts); there
# is intentionally no replicaCount value and no HPA.

image:
  # Built from this repository's Dockerfile; no registry image is published.
  repository: relaycast-self-host
  tag: local
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Required. Public origin clients use (embedded in signed file URLs and the A2A
# card). Must be an HTTPS public DNS origin unless allowInsecureBaseUrl is set.
# For an in-cluster-only install use the Service name with allowInsecureBaseUrl,
# e.g. http://<release>-relaycast.<namespace>.svc:8787 (see NOTES).
baseUrl: ""

# Accept http:// (or IP-literal / single-label) baseUrl values whose host is
# loopback or private (RFC 1918, ULA, link-local, *.local, *.internal, *.lan,
# *.home.arpa, *.svc, *.svc.cluster.local, single-label service names).
# Public hosts stay HTTPS-only.
allowInsecureBaseUrl: false
# With allowInsecureBaseUrl: extra private DNS suffixes for a cluster with a
# custom clusterDomain (RELAYCAST_PRIVATE_DNS_SUFFIXES), e.g. [".svc.corp"].
# Entries ending in a public TLD are refused.
privateDnsSuffixes: []
# With allowInsecureBaseUrl: exact hosts treated as private
# (RELAYCAST_INSECURE_BASE_URL_HOSTS), e.g. ["relaycast.relaycast"] for a
# <svc>.<ns> short name. Names under a public TLD and IP literals are refused.
insecureBaseUrlHosts: []

# Anonymous public POST /v1/workspaces (RELAYCAST_PUBLIC_WORKSPACE_CREATE).
# null = automatic: disabled when secretKeys.internalSecret is set (a control
# plane provisions workspaces through /internal/workspaces), enabled otherwise.
# Set true/false to force it.
publicWorkspaceCreate: null

# Environment label used in logs.
environment: production

# Name of an existing Secret holding the deployment secrets. Nothing secret is
# ever rendered into this chart's manifests. A missing bootstrapSecret key
# leaves keyed anonymous creates disabled (fail closed).
existingSecret: ""
secretKeys:
  # RELAYCAST_WORKSPACE_BOOTSTRAP_SECRET: stable derivation secret for
  # anonymous keyed workspace retries.
  bootstrapSecret: workspace-bootstrap-secret
  # Opt-in. Key name (in existingSecret) of the internal admin secret; mounted
  # as RELAYCAST_INTERNAL_SECRET_FILE to enable the /internal admin API for a
  # trusted control plane. The key MUST exist when named (the pod will not
  # start otherwise) and be at least 32 characters (`openssl rand -hex 32`).
  # Empty leaves the admin API disabled.
  internalSecret: ""

# Require bootstrap-secret proof for anonymous keyed creates.
bootstrapProofRequired: false

# Opt-in message retention in days (unset keeps history forever).
messageTtlDays: null

# Additional container env entries (list of EnvVar).
extraEnv: []

persistence:
  enabled: true
  # Use an existing PVC instead of creating one.
  existingClaim: ""
  storageClass: ""
  # ReadWriteOnce is deliberate: one pod owns the SQLite file.
  accessMode: ReadWriteOnce
  size: 5Gi
  annotations: {}

service:
  type: ClusterIP
  port: 8787
  annotations: {}

containerPort: 8787

resources: {}
#  requests:
#    cpu: 100m
#    memory: 256Mi
#  limits:
#    memory: 1Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 4
readinessProbe:
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
startupProbe:
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

terminationGracePeriodSeconds: 30
