<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Relaycast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="logo">
        <span class="logo-icon">&#9670;</span>
        <span class="logo-text">relaycast</span>
      </a>
      <div class="nav-links">
        <a href="/dashboard.html">Dashboard</a>
        <button id="logout-btn" class="btn btn-sm">Log Out</button>
      </div>
    </div>
  </nav>

  <div class="dash-container" id="app" hidden>
    <!-- Org Info -->
    <div class="dash-header">
      <h1 id="org-name">Organization</h1>
      <span class="plan-badge" id="plan-badge">free</span>
    </div>

    <!-- Billing Section -->
    <section class="dash-section">
      <h2>Billing</h2>
      <div class="dash-card" id="billing-card">
        <div class="billing-info">
          <div class="billing-row">
            <span class="billing-label">Plan</span>
            <span class="billing-value" id="billing-plan">free</span>
          </div>
          <div class="billing-row">
            <span class="billing-label">Status</span>
            <span class="billing-value" id="billing-status">-</span>
          </div>
        </div>
        <div class="billing-actions">
          <button id="upgrade-btn" class="btn btn-primary">Upgrade to Pro</button>
          <button id="portal-btn" class="btn btn-ghost" hidden>Manage Subscription</button>
        </div>
      </div>
    </section>

    <!-- Workspaces Section -->
    <section class="dash-section">
      <div class="section-header">
        <h2>Workspaces</h2>
        <button id="create-ws-btn" class="btn btn-sm btn-primary">Create Workspace</button>
      </div>
      <div id="workspaces-list" class="workspaces-list">
        <p class="empty-state">Loading...</p>
      </div>
    </section>

    <!-- Claim Workspace Section -->
    <section class="dash-section">
      <h2>Claim an existing workspace</h2>
      <p class="section-desc">Have a free workspace? Enter its API key to add it to this organization.</p>
      <form id="claim-form" class="claim-form">
        <input type="text" id="claim-key" placeholder="rk_live_..." required>
        <button type="submit" class="btn btn-ghost">Claim</button>
      </form>
      <div id="claim-result" class="auth-success" hidden></div>
      <div id="claim-error" class="auth-error" hidden></div>
    </section>
  </div>

  <!-- Loading / Auth redirect -->
  <div class="auth-container" id="loading">
    <div class="auth-card">
      <p class="auth-sub">Loading dashboard...</p>
    </div>
  </div>

  <!-- Create Workspace Modal -->
  <div id="create-ws-modal" class="modal" hidden>
    <div class="modal-content auth-card">
      <h2>Create Workspace</h2>
      <form id="create-ws-form" class="auth-form">
        <div class="form-group">
          <label for="ws-name">Workspace name</label>
          <input type="text" id="ws-name" name="name" required placeholder="my-project">
        </div>
        <div id="create-ws-error" class="auth-error" hidden></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancel-ws-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API = 'https://api.relaycast.dev/v1';
    const app = document.getElementById('app');
    const loading = document.getElementById('loading');

    async function apiFetch(path, opts = {}) {
      const res = await fetch(`${API}${path}`, {
        credentials: 'include',
        ...opts,
        headers: { 'Content-Type': 'application/json', ...opts.headers },
      });
      return res.json();
    }

    async function init() {
      const orgRes = await apiFetch('/org');
      if (!orgRes.ok) {
        window.location.href = '/login.html';
        return;
      }

      const org = orgRes.data;
      document.getElementById('org-name').textContent = org.name;
      document.getElementById('plan-badge').textContent = org.plan;
      document.getElementById('plan-badge').className = `plan-badge plan-${org.plan}`;

      // Billing
      const billingRes = await apiFetch('/org/billing');
      if (billingRes.ok) {
        const b = billingRes.data;
        document.getElementById('billing-plan').textContent = b.plan;
        document.getElementById('billing-status').textContent = b.subscription_status || 'no subscription';

        if (b.plan === 'pro') {
          document.getElementById('upgrade-btn').hidden = true;
          document.getElementById('portal-btn').hidden = false;
        }
      }

      // Workspaces
      await loadWorkspaces();

      loading.hidden = true;
      app.hidden = false;
    }

    async function loadWorkspaces() {
      const wsRes = await apiFetch('/org/workspaces');
      const list = document.getElementById('workspaces-list');
      if (!wsRes.ok || wsRes.data.length === 0) {
        list.innerHTML = '<p class="empty-state">No workspaces yet.</p>';
        return;
      }
      list.innerHTML = wsRes.data.map(ws => `
        <div class="workspace-card">
          <div class="ws-info">
            <span class="ws-name">${ws.name}</span>
            <span class="ws-meta">Created ${new Date(ws.created_at).toLocaleDateString()}</span>
          </div>
          <div class="ws-activity">${ws.last_activity_at ? 'Active ' + new Date(ws.last_activity_at).toLocaleDateString() : 'No activity'}</div>
        </div>
      `).join('');
    }

    // Upgrade
    document.getElementById('upgrade-btn').addEventListener('click', async () => {
      const res = await apiFetch('/org/billing/checkout', { method: 'POST' });
      if (res.ok) {
        window.location.href = res.data.checkout_url;
      } else {
        alert(res.error?.message || 'Failed to create checkout session');
      }
    });

    // Portal
    document.getElementById('portal-btn').addEventListener('click', async () => {
      const res = await apiFetch('/org/billing/portal', { method: 'POST' });
      if (res.ok) {
        window.location.href = res.data.portal_url;
      }
    });

    // Create workspace
    const modal = document.getElementById('create-ws-modal');
    document.getElementById('create-ws-btn').addEventListener('click', () => { modal.hidden = false; });
    document.getElementById('cancel-ws-btn').addEventListener('click', () => { modal.hidden = true; });
    document.getElementById('create-ws-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('create-ws-error');
      errEl.hidden = true;
      const name = document.getElementById('ws-name').value;
      const res = await apiFetch('/org/workspaces', {
        method: 'POST',
        body: JSON.stringify({ name }),
      });
      if (res.ok) {
        modal.hidden = true;
        document.getElementById('ws-name').value = '';
        await loadWorkspaces();
      } else {
        errEl.textContent = res.error?.message || 'Failed to create workspace';
        errEl.hidden = false;
      }
    });

    // Claim workspace
    document.getElementById('claim-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const resultEl = document.getElementById('claim-result');
      const errEl = document.getElementById('claim-error');
      resultEl.hidden = true;
      errEl.hidden = true;

      const res = await apiFetch('/org/claim', {
        method: 'POST',
        body: JSON.stringify({ workspace_api_key: document.getElementById('claim-key').value }),
      });
      if (res.ok) {
        resultEl.textContent = `Workspace ${res.data.workspace_id} claimed!`;
        resultEl.hidden = false;
        document.getElementById('claim-key').value = '';
        await loadWorkspaces();
      } else {
        errEl.textContent = res.error?.message || 'Failed to claim workspace';
        errEl.hidden = false;
      }
    });

    // Logout
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await apiFetch('/orgs/logout', { method: 'POST' });
      window.location.href = '/';
    });

    init();
  </script>
</body>
</html>
