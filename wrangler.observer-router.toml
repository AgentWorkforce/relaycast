name = "relaycast-observer-router"
main = "packages/observer-router/src/worker.ts"
compatibility_date = "2024-12-01"

routes = [
  { pattern = "observer.relaycast.dev/*", zone_name = "relaycast.dev" },
  { pattern = "staging-observer.relaycast.dev/*", zone_name = "relaycast.dev" },
  { pattern = "*-observer.relaycast.dev/*", zone_name = "relaycast.dev" },
]

services = [
  { binding = "OBSERVER", service = "relaycast-observer" },
]
